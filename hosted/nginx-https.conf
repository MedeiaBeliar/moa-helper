server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name moa.chocolily.dev moa.moria-luluka.com moa.morialuluka.com moa.xn--o39a013c.tv;
    ssl_certificate /etc/letsencrypt/live/moa-helper/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moa-helper/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    include /etc/nginx/snippets/moa-cloudflare-realip.conf;
    add_header Strict-Transport-Security "max-age=15552000" always;
    client_max_body_size 32k;
    client_body_timeout 15s;
    access_log off;
    error_log /var/log/nginx/moa-helper-error.log warn;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/xml image/svg+xml;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / {
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
