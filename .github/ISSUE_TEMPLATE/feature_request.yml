name: Feature request
description: Explain the use case and the behavior you need.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain why the existing controls do not cover this case.
    validations:
      required: true
